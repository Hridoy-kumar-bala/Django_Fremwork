{% extends "base.html" %}
{% block contact %}
<h2>Change Password (Without Old Password)</h2>

{% if messages %}
  {% for message in messages %}
    <p style="color: green;">{{ message }}</p>
  {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Change Password</button>
</form>

<br>
<a href="{% url 'profile' %}">Back to Profile</a>
{% endblock %}
