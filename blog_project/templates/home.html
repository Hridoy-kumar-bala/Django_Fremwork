{% extends "base.html" %}
{% block content %}
<div class="d-flex flex-wrap justify-center px-5 pt-5">
{% for post in data %}
  <div class="col-sm-3 mx-3">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title"> {{post.tittle}} </h5>
        <p class="card-text">{{post.content}}</p>
        <p>Author : {{post.author.name}}</p>
        <p>Category : 
            {% for cat in post.category.all %}
            <button class="btn btn-warning m-2" disable>{{cat.name}}</button>
            
            {% endfor %}
        </p>

        <a href="#" class="btn btn-primary">Go somewhere</a>
      </div>
    </div>
  </div>


{% endfor %}
</div>

{% endblock  %}
