<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style> 
      .success{
        color : green
      }
     </style>
  </head>
  <body>
    <nav class="navbar navbar-light bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand text-white ">Navbar</a>
    <div class="d-flex mx-4" role="search" >
        
        {% if user.is_authenticated %}
        <a href="{% url 'profile' %}"><button type="button" class="btn btn-danger mx-4" type="submit">Profile </button></a>
        <a href="{% url 'logout' %}"><button type="button" class="btn btn-danger mx-4" type="submit">Log out </button></a>
        {% else %}
        <a href="{% url 'signup' %}"><button class="btn btn-outline-success mx-4 text-white" type="submit">signup</button></a>
        <a href="{% url 'login' %}"><button type="button" class="btn btn-danger mx-4" type="submit">Login </button></a>
        {% endif %}

    </div>
  </div>
</nav>
{% block body %}


{% endblock  %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
