{% extends "base.html" %}

{% block content %}
 <div style="width: 50%; height: 100px; margin: auto;" class="pt-5">
      <h3> Submit Your Information</h3>
    </div>
        <h1> I am inside GET userface</h1>
    <form method="get" action="/first_app/get_about/">
        {% csrf_token %}
  <div class="mb-3">
    <label for="exampleInputName" class="form-label">Name</label>
    <input type="text" class="form-control" id="exampleInputName" aria-describedby="nameHelp" name="get_username">
    <div id="nameHelp" class="form-text">We'll never share your name with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="get_email">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
<select class="form-select p-2 margin: auto" aria-label="Disabled select example" name="select1">
  <option class="pd-3" selected>Open this select menu</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
    <option value="4">4</option>
  <option value="5">5</option>

</select>
  <button  type="submit" class="btn btn-primary p-2">Submit</button>
</form>


{% endblock %}
