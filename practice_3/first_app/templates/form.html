{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h3 class= "d-flex justify-content-center" >Form</h3>
<div class="d-flex justify-content-center align-items-center bg-dark text-white">

    <form method="POST">
        {% csrf_token %}

        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">
            Submit
        </button>
    </form>
</div>

{% endblock %}
